services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingress:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.webhook.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      SPINE_SQLITE_PATH: /data/pr_reviewer.sqlite
    ports:
      - "8000:8000"
    volumes:
      - review-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq backend.worker.WorkerSettings
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      SPINE_SQLITE_PATH: /data/pr_reviewer.sqlite
    volumes:
      - review-data:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - ingress

volumes:
  redis-data:
  review-data:
